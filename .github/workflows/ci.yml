name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Python ───────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff — lint
        run: ruff check .

      - name: ruff — format check
        run: ruff format --check .

      - name: mypy — type check
        run: mypy ingestion pipeline ml api

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint-python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: guardrail_test
          POSTGRES_DB: burnout_guardrail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail_test
      POSTGRES_DB: burnout_guardrail_test
      DATABASE_URL: postgresql+asyncpg://guardrail:guardrail_test@localhost:5432/burnout_guardrail_test
      SECRET_KEY: ci_secret_key_not_used_in_production_32c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ --cov --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python-unit

  # ─── TypeScript / React ───────────────────────────────────────────────────
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: lint-typescript
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

  # ─── Build & Push ─────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-python, test-typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push — Backend API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f api/Dockerfile \
            -t $ECR_REGISTRY/burnout-guardrail-api:$IMAGE_TAG \
            -t $ECR_REGISTRY/burnout-guardrail-api:latest .
          docker push $ECR_REGISTRY/burnout-guardrail-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/burnout-guardrail-api:latest

      - name: Build & push — ML Inference
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ml/inference/Dockerfile \
            -t $ECR_REGISTRY/burnout-guardrail-ml:$IMAGE_TAG \
            -t $ECR_REGISTRY/burnout-guardrail-ml:latest .
          docker push $ECR_REGISTRY/burnout-guardrail-ml:$IMAGE_TAG
          docker push $ECR_REGISTRY/burnout-guardrail-ml:latest

      - name: Build & push — Dashboard
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f dashboard/Dockerfile \
            -t $ECR_REGISTRY/burnout-guardrail-dashboard:$IMAGE_TAG \
            -t $ECR_REGISTRY/burnout-guardrail-dashboard:latest dashboard/
          docker push $ECR_REGISTRY/burnout-guardrail-dashboard:$IMAGE_TAG
          docker push $ECR_REGISTRY/burnout-guardrail-dashboard:latest
