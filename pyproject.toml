[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burnout-guardrail"
version = "0.1.0"
description = "Real-time digital exhaust monitoring system for team burnout prediction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
pipeline = [
    "apache-airflow>=2.9.0",
    "pandas>=2.0.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "joblib>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.0.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "pyyaml>=6.0.0",
    "locust>=2.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "pipeline", "ml", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "PT", "RUF"]
ignore = [
    "ANN401",  # Any annotation — handled with per-case justification
    "B008",    # Depends() in defaults is the idiomatic FastAPI pattern
    "UP042",   # str+Enum is intentional for label access without .value
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",    # no annotations required in tests
    "S101",   # assert is fine in tests
    "N802",   # uppercase fixture names (X_train, X_test) follow ML convention
    "N803",   # uppercase argument names (X_train, X_test) follow ML convention
    "N806",   # uppercase variables (X, X_train) follow ML convention
    "RUF003", # × and – in math comments are intentional
    "E501",   # long test signatures with typed parameters
]
"ml/**" = [
    "N803",   # X, X_train, X_new follow scikit-learn/numpy convention
    "N806",   # X, X_seq, X_curr follow scikit-learn/numpy convention
    "RUF002", # math symbols (×, −) are intentional in ML docstrings
    "RUF003", # math symbols in comments are intentional
]
"pipeline/**" = [
    "RUF002", # math symbols in transform docstrings are intentional
]
"**/*.ipynb" = [
    "E402",   # imports below cell-level code is normal in notebooks
    "RUF001", # math symbols (×, σ) are intentional in notebook prose
    "RUF002", # math symbols in docstrings are intentional
    "RUF003", # math symbols in comments are intentional
    "E501",   # long lines acceptable in notebook output cells
    "B905",   # zip(strict=) optional in exploratory notebook code
    "C408",   # dict() literals vs constructors — style choice in notebooks
    "RUF005", # list concatenation style is fine in notebooks
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastavro.*", "confluent_kafka.*", "joblib.*", "sklearn.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Airflow lacks py.typed; DAG files also use untyped @dag/@task decorators.
module = ["airflow.*", "pipeline.dags.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Airflow operator base classes are untyped; suppress all errors in custom operators.
module = ["pipeline.operators.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]

[tool.coverage.run]
source = ["ingestion", "pipeline", "ml", "api"]
omit = [
    "tests/*",
    "*/migrations/*",
    # Require live services (Airflow, Kafka, Postgres) — covered by integration tests
    "pipeline/dags/*",
    "pipeline/operators/*",
    "pipeline/db/*",
    "pipeline/repository.py",
    "pipeline/models.py",
    # FastAPI lifespan loads model artifacts from disk — covered by integration tests
    "ml/inference/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
