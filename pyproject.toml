[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burnout-guardrail"
version = "0.1.0"
description = "Real-time digital exhaust monitoring system for team burnout prediction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
pipeline = [
    "apache-airflow>=2.9.0",
    "pandas>=2.0.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "joblib>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.0.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "pipeline", "ml", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "PT", "RUF"]
ignore = [
    "ANN101",  # self annotation
    "ANN102",  # cls annotation
    "ANN401",  # Any annotation — handled with per-case justification
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastavro.*", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]

[tool.coverage.run]
source = ["ingestion", "pipeline", "ml", "api"]
omit = [
    "tests/*",
    "*/migrations/*",
    # Require live services (Airflow, Kafka, Postgres) — covered by integration tests
    "pipeline/dags/*",
    "pipeline/operators/*",
    "pipeline/db/*",
    "pipeline/repository.py",
    "pipeline/models.py",
    # FastAPI lifespan loads model artifacts from disk — covered by integration tests
    "ml/inference/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
