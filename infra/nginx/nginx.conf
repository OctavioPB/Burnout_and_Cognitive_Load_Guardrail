# Nginx reverse-proxy + static asset CDN config
# Serves the Vite-built dashboard from /var/www/dashboard
# and proxies /api/* to the FastAPI backend (port 8000).
#
# Key production concerns addressed here:
#   - Static asset caching (immutable for hashed filenames)
#   - gzip compression
#   - Security headers (belt-and-suspenders alongside app-layer headers)
#   - Rate limiting to protect the API from abuse
#   - TLS termination (certificate paths are placeholders — use certbot/ACM)

# ── Rate limiting zones ───────────────────────────────────────────────────────
# 10 req/s per IP for the API, 100 req/s for static assets
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=asset_limit:10m rate=100r/s;

upstream burnout_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name guardrail.example.com;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guardrail.example.com;

    # TLS — replace with certbot-managed paths or ACM in AWS
    ssl_certificate     /etc/ssl/certs/guardrail.crt;
    ssl_certificate_key /etc/ssl/private/guardrail.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Static dashboard assets ───────────────────────────────────────────────
    root /var/www/dashboard;
    index index.html;

    location / {
        limit_req zone=asset_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;

        # Cache HTML with short TTL (revalidate on every request)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # Vite hashes all JS/CSS filenames → safe to cache immutably for 1 year
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://burnout_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;

        # Retry on upstream connection errors (not on idempotent failures)
        proxy_next_upstream error timeout;

        # API responses must not be cached by nginx (cache is handled app-side)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_no_cache 1;
    }

    # ── /metrics is cluster-internal only (deny public access) ───────────────
    location /api/metrics {
        deny all;
    }

    # ── Security headers (belt-and-suspenders on top of app middleware) ───────
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"detail":"Too many requests — please slow down."}';
        default_type application/json;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"detail":"Service temporarily unavailable."}';
        default_type application/json;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 404; }
    location ~ /\.                         { return 404; }
}
